version: '3'

vars:
  BINARY: dialogic
  # Same place the Go CLI was installed to, so PATH and skills keep working.
  INSTALL_DIR:
    sh: 'if command -v go >/dev/null 2>&1; then echo "$(go env GOPATH)/bin"; else echo "$HOME/.local/bin"; fi'

tasks:
  deps:
    desc: Install npm dependencies (the engine's own deps come from ../dialogic/node_modules)
    sources: [package.json, package-lock.json]
    cmds:
      - npm install --no-audit --no-fund
      - test -d ../dialogic/node_modules || (cd ../dialogic && npm install)

  build:
    desc: Bundle dist/dialogic.mjs (one executable file, needs Node >= 22)
    deps: [deps]
    sources:
      - src/**/*.ts
      - build.mjs
      - ../dialogic/src/game/**/*
      - ../dialogic/src/exec/**/*
      - ../player-runner/src/**/*
      - ../backend/app/game_mcp/schema.json
    generates: [dist/dialogic.mjs]
    cmds:
      - node build.mjs

  test:
    desc: Typecheck and run the unit tests
    deps: [deps]
    cmds:
      - npx tsc --noEmit
      - npx vitest run

  install:
    desc: Build and install dialogic to {{.INSTALL_DIR}} (on PATH)
    deps: [build]
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      # Remove first: overwriting a file another process has open can kill it on macOS.
      - rm -f {{.INSTALL_DIR}}/{{.BINARY}}
      - cp dist/dialogic.mjs {{.INSTALL_DIR}}/{{.BINARY}}
      - chmod 755 {{.INSTALL_DIR}}/{{.BINARY}}
      - 'echo "Installed {{.INSTALL_DIR}}/{{.BINARY}}"'

  clean:
    desc: Remove the build and Task's checksum cache
    cmds:
      - rm -rf dist .task
